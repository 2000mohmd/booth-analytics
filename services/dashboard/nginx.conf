# Two tiers: the public kiosk display (Kiosk.jsx, /kiosk route) only ever needs aggregate,
# anonymous numbers - those specific endpoints stay open. Everything else (the ops dashboard,
# the /live debug page, and in particular /tracks/live, /ws/tracks, /debug/video/* which expose
# per-track bbox/video data even if anonymized) requires HTTP Basic Auth. See
# deploy/windows/generate-htpasswd.ps1 for generating the credentials file this mounts.
#
# nginx location precedence: an exact `location =` match wins over a prefix match, so each
# open endpoint gets its own exact block ahead of the general auth-gated /api/ and /ws/
# catch-alls below - anything not explicitly listed as open falls through to the gated block.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location = /api/health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # Open: exactly what Kiosk.jsx (the public TV display) calls - aggregate numbers only.
    location = /api/occupancy/current {
        proxy_pass http://api:8000/occupancy/current;
        proxy_set_header Host $host;
    }
    location = /api/totals/today {
        proxy_pass http://api:8000/totals/today;
        proxy_set_header Host $host;
    }
    location = /api/demographics/today {
        proxy_pass http://api:8000/demographics/today;
        proxy_set_header Host $host;
    }
    location = /api/traffic/hourly {
        proxy_pass http://api:8000/traffic/hourly;
        proxy_set_header Host $host;
    }
    location = /api/alerts/active {
        proxy_pass http://api:8000/alerts/active;
        proxy_set_header Host $host;
    }
    location = /ws/live {
        proxy_pass http://api:8000/ws/live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Auth-gated: the ops dashboard's own endpoints (dwell distribution, etc), and everything
    # per-track/per-visitor (tracks/live, ws/tracks, debug video) - not casually public even
    # though it's anonymized.
    location /api/ {
        auth_basic "booth-analytics ops";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        auth_basic "booth-analytics ops";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
