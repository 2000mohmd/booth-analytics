services:
  ingestion:
    build: .
    command: python3 services/ingestion/main.py
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  metrics_engine:
    build: .
    command: python3 services/metrics_engine/main.py
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data

  api:
    build: .
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data

  alerting:
    build: .
    command: python3 services/alerting/main.py
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
